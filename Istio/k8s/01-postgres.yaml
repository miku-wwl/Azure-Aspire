# =============================================================================
# PostgreSQL - Demo Database
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: demo-app
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS demo_data (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      value TEXT,
      created_at TIMESTAMP DEFAULT NOW()
    );

    INSERT INTO demo_data (name, value) VALUES
      ('welcome', 'Hello from Cloud Native Demo!'),
      ('trace-test', 'This data flows through the full trace chain'),
      ('observability', 'Istio + OTel + Jaeger + Prometheus + Loki + Grafana')
    ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo-app
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo-app
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # We inject sidecar for PostgreSQL so Istio can trace connections to it
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "devuser"
            - name: POSTGRES_PASSWORD
              value: "devpass"
            - name: POSTGRES_DB
              value: "devdb"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: init-sql
          configMap:
            name: postgres-init
