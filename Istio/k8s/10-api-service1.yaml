# =============================================================================
# api-service1 - Backend Microservice 1
# Port: 3001
# Calls: api-service2 + PostgreSQL
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-service1
  namespace: demo-app
  labels:
    app: api-service1
    version: v1
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: api-service1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service1
  namespace: demo-app
  labels:
    app: api-service1
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service1
  template:
    metadata:
      labels:
        app: api-service1
        version: v1
      annotations:
        # Let Istio know the protocol so it generates proper metrics
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: api-service1
          image: demo-api-service1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: PG_HOST
              value: "postgres.demo-app.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: "devuser"
            - name: PG_PASSWORD
              value: "devpass"
            - name: PG_DB
              value: "devdb"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
