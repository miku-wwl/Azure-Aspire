# =============================================================================
# Kustomize configuration - deploy everything with one command:
#   kubectl apply -k Istio/k8s/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespaces.yaml
  - 01-postgres.yaml
  - 10-api-service1.yaml
  - 11-api-service2.yaml
  - 12-frontend.yaml
  - 20-istio-telemetry.yaml
  - 21-istio-gateway.yaml
  - 30-otel-collector.yaml
  - 31-jaeger.yaml
  - 32-prometheus.yaml
  - 33-loki.yaml
  - 34-grafana.yaml
